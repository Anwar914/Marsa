<body><a class="skip" href="#main">Skip to content</a><aside><a class="brand" href="#home"><span class="logo">M</span> MARSA <span lang="ar" dir="rtl">مرسى</span><span class="sub">TECHNICAL ENGLISH</span></a><div class="navlabel">YOUR LEARNING SPACE</div><nav id="nav" aria-label="Main navigation"></nav><div class="sidefoot">English for<br><strong>Mechanical Engineers</strong><p>Modules 1–6 · Available offline</p></div></aside><div class="workspace"><header><span>EN <span class="muted">· Your exam practice</span></span><span class="badge">Saved locally</span></header><main id="main" tabindex="-1"></main><footer>Based on your TXT file · Added material is labelled · Official exam format unconfirmed</footer></div><script>const DATA = {"groups": [{"id": "A1", "title": "Tools & PPE. Write the English term.", "questions": [{"q": "Hammer zum Einschlagen von Nägeln mit gespaltener Rückseite: c… hammer", "a": ["claw hammer"], "ex": "Technical term from worksheet A1. British and American variants are accepted."}, {"q": "Werkzeug zum Festziehen von Sechskantschrauben: s… / w…", "a": ["spanner", "wrench"], "ex": "Technical term from worksheet A1. British and American variants are accepted."}, {"q": "Schutzbrille: s… g…", "a": ["safety goggles", "safety glasses"], "ex": "Technical term from worksheet A1. British and American variants are accepted."}, {"q": "Gehörschutz (2 Wörter): e… p… / e… d…", "a": ["ear plugs", "ear defenders", "ear muffs", "earplugs", "earmuffs"], "ex": "Technical term from worksheet A1. British and American variants are accepted."}, {"q": "Sicherheitsschuhe mit Stahlkappe: s…-t… boots", "a": ["steel-toe boots", "steel-toed boots"], "ex": "Technical term from worksheet A1. British and American variants are accepted."}, {"q": "Elektrisches Werkzeug zum Bohren von Löchern: p… d…", "a": ["power drill"], "ex": "Technical term from worksheet A1. British and American variants are accepted."}, {"q": "Werkzeug zum Abschneiden von Draht: w… c…", "a": ["wire cutters"], "ex": "Technical term from worksheet A1. British and American variants are accepted."}, {"q": "Schutzhelm: h… h…", "a": ["hard hat"], "ex": "Technical term from worksheet A1. British and American variants are accepted."}]}, {"id": "A2", "title": "Automotive & engine parts. Translate the German term into English.", "questions": [{"q": "Kurbelwelle", "a": ["crankshaft"], "ex": "Technical term from worksheet A2."}, {"q": "Kolben", "a": ["piston"], "ex": "Technical term from worksheet A2."}, {"q": "Zündkerze", "a": ["spark plug"], "ex": "Technical term from worksheet A2."}, {"q": "Auslassventil", "a": ["exhaust valve"], "ex": "Technical term from worksheet A2."}, {"q": "Zylinderkopf", "a": ["cylinder head"], "ex": "Technical term from worksheet A2."}, {"q": "Windschutzscheibe", "a": ["windscreen", "windshield"], "ex": "Technical term from worksheet A2."}, {"q": "Kofferraum", "a": ["boot", "trunk"], "ex": "Technical term from worksheet A2."}, {"q": "Getriebe", "a": ["gearbox", "transmission"], "ex": "Technical term from worksheet A2."}]}, {"id": "A3", "title": "EVs, energy and materials. Fill in: range, charging station, renewable, fossil fuels, regenerative braking, tensile strength, composite, wind turbine.", "questions": [{"q": "An electric car’s … tells you how far it can drive on one charge.", "a": ["range"], "ex": "Choose the technical term that correctly completes the sentence."}, {"q": "Coal, oil and natural gas are … .", "a": ["fossil fuels"], "ex": "Choose the technical term that correctly completes the sentence."}, {"q": "With …, the motor works as a generator and recovers energy.", "a": ["regenerative braking"], "ex": "Choose the technical term that correctly completes the sentence."}, {"q": "Solar and wind power are … energy sources.", "a": ["renewable"], "ex": "Choose the technical term that correctly completes the sentence."}, {"q": "Carbon-fibre-reinforced plastic is a … material.", "a": ["composite"], "ex": "Choose the technical term that correctly completes the sentence."}, {"q": "The maximum stress a material can withstand before breaking is its … .", "a": ["tensile strength"], "ex": "Choose the technical term that correctly completes the sentence."}, {"q": "A … converts the kinetic energy of the wind into electricity.", "a": ["wind turbine"], "ex": "Choose the technical term that correctly completes the sentence."}, {"q": "Drivers can recharge their batteries at a public … .", "a": ["charging station"], "ex": "Choose the technical term that correctly completes the sentence."}]}, {"id": "B1", "title": "Present simple or present continuous?", "questions": [{"q": "A compressor (increase) … the pressure of a gas.", "a": ["increases"], "ex": "Use the present simple for general facts. Use the present continuous (am/is/are + -ing) for actions happening now or temporary projects."}, {"q": "Look! The technician (replace) … the filter right now.", "a": ["is replacing"], "ex": "Use the present simple for general facts. Use the present continuous (am/is/are + -ing) for actions happening now or temporary projects."}, {"q": "Our team (develop) … a new cooling system this semester.", "a": ["is developing"], "ex": "Use the present simple for general facts. Use the present continuous (am/is/are + -ing) for actions happening now or temporary projects."}, {"q": "Water (boil) … at 100 °C at sea level.", "a": ["boils"], "ex": "Use the present simple for general facts. Use the present continuous (am/is/are + -ing) for actions happening now or temporary projects."}, {"q": "The engine (not run) … at the moment because the battery is flat.", "a": ["is not running", "isn’t running", "isn't running"], "ex": "Use the present simple for general facts. Use the present continuous (am/is/are + -ing) for actions happening now or temporary projects."}]}, {"id": "B2", "title": "Passive voice. Rewrite the sentences in the passive voice.", "questions": [{"q": "The engineer checks the pressure every hour. → The pressure …", "a": ["is checked every hour", "is checked by the engineer every hour"], "ex": "Passive voice: be in the appropriate tense + past participle. The active object becomes the passive subject. Enter only the ending after the given sentence opening."}, {"q": "Workers assembled the car body in Wolfsburg. → The car body …", "a": ["was assembled in Wolfsburg"], "ex": "Passive voice: be in the appropriate tense + past participle. The active object becomes the passive subject. Enter only the ending after the given sentence opening."}, {"q": "The robot will weld the parts. → The parts …", "a": ["will be welded", "will be welded by the robot"], "ex": "Passive voice: be in the appropriate tense + past participle. The active object becomes the passive subject. Enter only the ending after the given sentence opening."}, {"q": "They have tested the new battery. → The new battery …", "a": ["has been tested"], "ex": "Passive voice: be in the appropriate tense + past participle. The active object becomes the passive subject. Enter only the ending after the given sentence opening."}, {"q": "In a four-stroke engine, the spark plug ignites the mixture. → In a four-stroke engine, the mixture …", "a": ["is ignited by the spark plug"], "ex": "Passive voice: be in the appropriate tense + past participle. The active object becomes the passive subject. Enter only the ending after the given sentence opening."}]}, {"id": "B3", "title": "Conditionals. Enter the correct form.", "questions": [{"q": "If you heat ice, it (melt) … . (Type 0)", "a": ["melts"], "ex": "Type 0: present + present. Type 1: present + will. Type 2: past + would. Type 3: past perfect + would have + past participle."}, {"q": "If the price of batteries falls, more people (buy) … electric cars. (Type 1)", "a": ["will buy"], "ex": "Type 0: present + present. Type 1: present + will. Type 2: past + would. Type 3: past perfect + would have + past participle."}, {"q": "If Germany (use) … only renewable energy, CO₂ emissions would drop sharply. (Type 2)", "a": ["used"], "ex": "Type 0: present + present. Type 1: present + will. Type 2: past + would. Type 3: past perfect + would have + past participle."}, {"q": "If they had maintained the pump, it (not fail) … . (Type 3)", "a": ["would not have failed", "wouldn’t have failed"], "ex": "Type 0: present + present. Type 1: present + will. Type 2: past + would. Type 3: past perfect + would have + past participle."}]}, {"id": "B4", "title": "Past perfect, future perfect and used to.", "questions": [{"q": "By 2030, many countries (phase out) … coal power. (Future Perfect)", "a": ["will have phased out"], "ex": "Future perfect: will have + past participle. Past perfect: had + past participle. Past habits: used to + infinitive."}, {"q": "When we arrived, the machine (already / stop) … . (Past Perfect)", "a": ["had already stopped"], "ex": "Future perfect: will have + past participle. Past perfect: had + past participle. Past habits: used to + infinitive."}, {"q": "Cars … (use) have carburettors; today they have fuel injection.", "a": ["used to"], "ex": "Future perfect: will have + past participle. Past perfect: had + past participle. Past habits: used to + infinitive."}, {"q": "By the end of the test, the motor (run) … for 500 hours. (Future Perfect)", "a": ["will have run"], "ex": "Future perfect: will have + past participle. Past perfect: had + past participle. Past habits: used to + infinitive."}]}, {"id": "B5", "title": "Countable / uncountable. Choose the correct option.", "questions": [{"q": "We need (a few / a little) … more information.", "a": ["a little"], "ex": "Countable nouns: many / a few. Uncountable nouns (information, oil, energy): much / a little."}, {"q": "How (much / many) … bolts are in the box?", "a": ["many"], "ex": "Countable nouns: many / a few. Uncountable nouns (information, oil, energy): much / a little."}, {"q": "There is (a few / a little) … oil left in the tank.", "a": ["a little"], "ex": "Countable nouns: many / a few. Uncountable nouns (information, oil, energy): much / a little."}, {"q": "How (much / many) … energy does the heat pump use?", "a": ["much"], "ex": "Countable nouns: many / a few. Uncountable nouns (information, oil, energy): much / a little."}]}], "exams": [{"reading": "How a heat pump works. A heat pump moves heat from a cold place to a warm place. It does not create heat; it transfers it. The system consists of four main components: an evaporator, a compressor, a condenser and an expansion valve. A refrigerant circulates through these components. In the evaporator, the refrigerant absorbs heat from the outside air, the ground or water and evaporates. The compressor then increases the pressure and temperature of the gas. In the condenser, the hot gas releases its heat to the heating system of the building and condenses back into a liquid. Finally, the expansion valve reduces the pressure, and the cycle starts again. The efficiency of a heat pump is described by its coefficient of performance (COP). A COP of 4 means that the pump delivers four units of heat for every unit of electricity it uses. Heat pumps are considered a key technology for the energy transition because they can be powered by renewable electricity.", "read": [{"q": "Does a heat pump produce heat? Explain. (2 points)", "a": "No – it transfers heat from a cold to a warm place.", "p": 2}, {"q": "Name the four main components. (4 points)", "a": "Evaporator, compressor, condenser, expansion valve.", "p": 4}, {"q": "What happens in the evaporator? (2 points)", "a": "The refrigerant absorbs heat from the air, ground or water and evaporates.", "p": 2}, {"q": "What does the compressor do? (2 points)", "a": "It increases the pressure and temperature of the gas.", "p": 2}, {"q": "What does a COP of 4 mean? (3 points)", "a": "It delivers four units of heat per one unit of electricity.", "p": 3}, {"q": "Why are heat pumps important for the energy transition? (2 points)", "a": "It can run on renewable electricity.", "p": 2}], "vocab": [{"q": "Schutzhandschuhe", "a": ["protective gloves"], "added": false}, {"q": "Schraubenzieher", "a": ["screwdriver"], "added": false}, {"q": "Kurbelwelle", "a": ["crankshaft"], "added": false}, {"q": "Zylinder", "a": ["cylinder"], "added": false}, {"q": "Ladestation", "a": ["charging station"], "added": false}, {"q": "Reichweite", "a": ["range"], "added": false}, {"q": "erneuerbare Energie", "a": ["renewable energy"], "added": false}, {"q": "Verbundwerkstoff", "a": ["composite", "composite material"], "added": false}, {"q": "Druck", "a": ["pressure"], "added": false}, {"q": "Wirkungsgrad", "a": ["efficiency"], "added": false}], "grammar": [{"q": "Currently, engineers (work) … on solid-state batteries.", "a": ["are working"]}, {"q": "The first electric car (build) … in the 19th century. (passive voice)", "a": ["was built"]}, {"q": "If the temperature (rise) … above 90 °C, the system shuts down.", "a": ["rises"]}, {"q": "By next year, the company (install) … 2,000 charging stations.", "a": ["will have installed"]}, {"q": "A hydraulic jack (use) … Pascal’s law.", "a": ["uses"]}, {"q": "When the inspector arrived, the leak (already / repair) … . (passive voice)", "a": ["had already been repaired"]}, {"q": "If I (be) … you, I would check the valves first.", "a": ["were"]}, {"q": "The oil (change) … every 15,000 km. (passive voice)", "a": ["is changed"]}, {"q": "The pump moves the refrigerant through the system.", "a": ["The refrigerant is moved through the system by the pump", "The refrigerant is moved through the system"]}, {"q": "Engineers designed the turbine in 2020.", "a": ["The turbine was designed in 2020", "The turbine was designed by engineers in 2020"]}, {"q": "They will replace the old boilers.", "a": ["The old boilers will be replaced"]}, {"q": "Someone has damaged the cable.", "a": ["The cable has been damaged"]}, {"q": "The compressor is increasing the pressure always.", "a": ["The compressor always increases the pressure"]}, {"q": "How much screws do we need?", "a": ["How many screws do we need?"]}, {"q": "If it will rain, the test is cancelled.", "a": ["If it rains, the test is cancelled"]}], "writing": "Describe how a four-stroke internal combustion engine works (150–200 words). Include: a short overview, the four strokes in the correct order, what the piston and valves do in each stroke. Use the present simple and at least three passive sentences."}, {"reading": "Electric vehicles. An electric vehicle (EV) is powered by one or more electric motors instead of an internal combustion engine. The energy is stored in a lithium-ion battery pack, which is usually placed under the floor of the car to lower the centre of gravity. An inverter converts the direct current (DC) from the battery into alternating current (AC) for the motor. When the driver brakes, regenerative braking allows the motor to act as a generator, so part of the kinetic energy is fed back into the battery. Compared with conventional cars, EVs have far fewer moving parts, which reduces maintenance costs. However, their range is still limited, and charging takes longer than refuelling. Fast-charging stations can charge a battery to 80 % in about 20 to 30 minutes. Manufacturers such as Volkswagen and Mercedes-Benz are investing billions in new battery technologies, for example solid-state batteries, which are expected to offer a higher energy density and improved safety.", "read": [{"q": "Where is the battery usually placed, and why? (2 points)", "a": "Under the floor, to lower the centre of gravity.", "p": 2}, {"q": "What is the function of the inverter? (2 points)", "a": "It converts DC from the battery into AC for the motor.", "p": 2}, {"q": "Explain regenerative braking. (3 points)", "a": "When braking, the motor acts as a generator and feeds kinetic energy back into the battery.", "p": 3}, {"q": "Name one advantage and two disadvantages of EVs mentioned in the text. (3 points)", "a": "Fewer moving parts / lower maintenance costs; limited range and longer charging time.", "p": 3}, {"q": "How long does fast charging to 80 % take? (1 points)", "a": "About 20–30 minutes.", "p": 1}, {"q": "What are the expected benefits of solid-state batteries? (2 points)", "a": "Higher energy density and improved safety.", "p": 2}, {"q": "Find a word in the text meaning “to put money into something”. (2 points)", "a": "to invest / investing", "p": 2}], "vocab": [{"q": "personal protective equipment", "a": ["Equipment such as helmets, gloves and goggles that protects workers from injuries."], "added": false}, {"q": "torque wrench", "a": ["A tool used to tighten a fastener to a specified torque."], "added": true}, {"q": "air compressor", "a": ["A machine that increases the pressure of air."], "added": true}, {"q": "piston", "a": ["A cylindrical part that moves up and down inside the cylinder."], "added": false}, {"q": "exhaust stroke", "a": ["The stroke in which burnt gases are pushed out of the cylinder."], "added": true}, {"q": "renewable energy", "a": ["Energy from sources that are naturally replenished."], "added": true}, {"q": "energy transition", "a": ["The shift from fossil fuels to more sustainable energy sources."], "added": true}, {"q": "polymer", "a": ["A material made of long chains of repeating molecular units."], "added": true}, {"q": "stress-strain diagram", "a": ["A graph showing the relationship between stress and strain in a material."], "added": true}, {"q": "hydraulic jack", "a": ["A device that lifts heavy loads using a liquid under pressure (Pascal’s law)."], "added": false}], "grammar": [{"q": "Every year, Germany (produce) … more electricity from wind.", "a": ["produces"]}, {"q": "Please be quiet – the professor (explain) … the experiment.", "a": ["is explaining"]}, {"q": "Before the oil crisis, cars (use) … much more fuel. (used to)", "a": ["used to use"]}, {"q": "By 2045, Germany (become) … climate-neutral. (Future Perfect)", "a": ["will have become"]}, {"q": "The air (compress) … and stored in a tank. (passive voice)", "a": ["is compressed"]}, {"q": "If engineers (not discover) … lithium-ion technology, EVs would not exist today. (Type 3)", "a": ["had not discovered", "hadn’t discovered"]}, {"q": "If the battery is empty, the car (stop) … . (Type 0)", "a": ["stops"]}, {"q": "We (test) … three prototypes so far. (Present Perfect)", "a": ["have tested"]}, {"q": "The pressure is too high. The valve opens. (Type 0)", "a": ["If the pressure is too high, the valve opens"]}, {"q": "We get the funding. We will build a test rig. (Type 1)", "a": ["If we get the funding, we will build a test rig"]}, {"q": "I don’t have a car. I don’t drive to university. (Type 2)", "a": ["If I had a car, I would drive to university"]}, {"q": "How … time do we have?", "a": ["much"]}, {"q": "Only … students passed the test.", "a": ["a few"]}, {"q": "Add … grease to the bearing.", "a": ["a little"]}, {"q": "How … kilowatts does the motor have?", "a": ["many"]}], "writing": "Describe how an air compressor works (150–200 words). Include: what it is used for, its main parts (motor, piston or rotary screw, tank, pressure switch, valves) and the working process step by step. Use the present simple and at least three passive sentences."}], "engineModel": "A four-stroke engine converts the chemical energy of fuel into mechanical energy. Each cycle consists of four strokes. In the intake stroke, the piston moves down and the air-fuel mixture is drawn into the cylinder through the open intake valve. In the compression stroke, both valves are closed and the mixture is compressed by the rising piston. In the power stroke, the mixture is ignited by the spark plug, and the expanding gases push the piston down. In the exhaust stroke, the exhaust valve opens and the burnt gases are pushed out by the piston. The up-and-down movement is converted into rotation by the crankshaft.", "source": "Technical English – Übungen & Probeklausuren\n21. Nov. 2026 · @Anwar\nHinweise\nAlle Aufgaben sind im Stil deines Moodle-Kurses „English for Mechanical Engineers“ (Modul 1–6) geschrieben. Das echte Klausurformat steht nicht auf Moodle – frag Anne oder Joe, welche Aufgabentypen drankommen, und gewichte entsprechend.\n1.  Übungsblätter A und B: jederzeit, passend zum Thema der Woche im Lernplan.\n2.  Probeklausur 1 am 15.01., Probeklausur 2 am 22.01.: 90 Minuten, ohne Wörterbuch, ohne Handy.\n3.  Erst danach die Lösungen am Ende anschauen. Deine Schreibaufgaben kannst du mir in den Chat kopieren – ich korrigiere und bewerte sie.\nBestanden ist meist ab 50 % – Ziel für die Probeklausuren: mindestens 40 von 60 Punkten.\nÜbungsblatt A: Vokabeln\nA1 – Tools & PPE (Modul 1). Schreib das englische Wort.\n1.  Hammer zum Einschlagen von Nägeln mit gespaltener Rückseite: c… hammer\n2.  Werkzeug zum Festziehen von Sechskantschrauben: s… / w…\n3.  Schutzbrille: s… g…\n4.  Gehörschutz (2 Wörter): e… p… / e… d…\n5.  Sicherheitsschuhe mit Stahlkappe: s…-t… boots\n6.  Elektrisches Werkzeug zum Bohren von Löchern: p… d…\n7.  Werkzeug zum Abschneiden von Draht: w… c…\n8.  Schutzhelm: h… h…\nA2 – Auto & Motor (Modul 3). Verbinde Deutsch und Englisch.\nDeutsch\nEnglisch (durcheinander)\nKurbelwelle\nspark plug\nKolben\nexhaust valve\nZündkerze\ncrankshaft\nAuslassventil\npiston\nZylinderkopf\nwindscreen / windshield\nWindschutzscheibe\ncylinder head\nKofferraum\ngearbox / transmission\nGetriebe\nboot / trunk\nA3 – EV, Energie, Materials (Modul 4–6). Setze das passende Wort ein: range, charging station, renewable, fossil fuels, regenerative braking, tensile strength, composite, wind turbine.\n1.  An electric car’s … tells you how far it can drive on one charge.\n2.  Coal, oil and natural gas are … .\n3.  With …, the motor works as a generator and recovers energy.\n4.  Solar and wind power are … energy sources.\n5.  Carbon-fibre-reinforced plastic is a … material.\n6.  The maximum stress a material can withstand before breaking is its … .\n7.  A … converts the kinetic energy of the wind into electricity.\n8.  Drivers can recharge their batteries at a public … .\nÜbungsblatt B: Grammatik\nB1 – Present Simple oder Present Continuous?\n1.  A compressor (increase) … the pressure of a gas.\n2.  Look! The technician (replace) … the filter right now.\n3.  Our team (develop) … a new cooling system this semester.\n4.  Water (boil) … at 100 °C at sea level.\n5.  The engine (not run) … at the moment because the battery is flat.\nB2 – Passiv. Schreib die Sätze ins Passiv.\n1.  The engineer checks the pressure every hour. → The pressure …\n2.  Workers assembled the car body in Wolfsburg. → The car body …\n3.  The robot will weld the parts. → The parts …\n4.  They have tested the new battery. → The new battery …\n5.  In a four-stroke engine, the spark plug ignites the mixture. → In a four-stroke engine, the mixture …\nB3 – Conditionals. Setze die richtige Form ein.\n1.  If you heat ice, it (melt) … . (Type 0)\n2.  If the price of batteries falls, more people (buy) … electric cars. (Type 1)\n3.  If Germany (use) … only renewable energy, CO₂ emissions would drop sharply. (Type 2)\n4.  If they had maintained the pump, it (not fail) … . (Type 3)\nB4 – Past Perfect, Future Perfect, used to.\n1.  By 2030, many countries (phase out) … coal power. (Future Perfect)\n2.  When we arrived, the machine (already / stop) … . (Past Perfect)\n3.  Cars … (use) have carburettors; today they have fuel injection.\n4.  By the end of the test, the motor (run) … for 500 hours. (Future Perfect)\nB5 – Countable / uncountable. Wähle.\n1.  We need (a few / a little) … more information.\n2.  How (much / many) … bolts are in the box?\n3.  There is (a few / a little) … oil left in the tank.\n4.  How (much / many) … energy does the heat pump use?\nProbeklausur 1 (60 Punkte, 90 min)\nTeil 1 – Leseverstehen (15 P.)\nHow a heat pump works. A heat pump moves heat from a cold place to a warm place. It does not create heat; it transfers it. The system consists of four main components: an evaporator, a compressor, a condenser and an expansion valve. A refrigerant circulates through these components. In the evaporator, the refrigerant absorbs heat from the outside air, the ground or water and evaporates. The compressor then increases the pressure and temperature of the gas. In the condenser, the hot gas releases its heat to the heating system of the building and condenses back into a liquid. Finally, the expansion valve reduces the pressure, and the cycle starts again. The efficiency of a heat pump is described by its coefficient of performance (COP). A COP of 4 means that the pump delivers four units of heat for every unit of electricity it uses. Heat pumps are considered a key technology for the energy transition because they can be powered by renewable electricity.\n1.  Does a heat pump produce heat? Explain. (2 P.)\n2.  Name the four main components. (4 P.)\n3.  What happens in the evaporator? (2 P.)\n4.  What does the compressor do? (2 P.)\n5.  What does a COP of 4 mean? (3 P.)\n6.  Why are heat pumps important for the energy transition? (2 P.)\nTeil 2 – Vokabeln (10 P.) Gib das englische Fachwort.\n1.  Schutzhandschuhe – 2. Schraubenzieher – 3. Kurbelwelle – 4. Zylinder – 5. Ladestation – 6. Reichweite – 7. erneuerbare Energie – 8. Verbundwerkstoff – 9. Druck – 10. Wirkungsgrad\nTeil 3 – Grammatik (15 P.)\nA) Setze die Verben in die richtige Form (je 1 P.):\n1.  Currently, engineers (work) … on solid-state batteries.\n2.  The first electric car (build) … in the 19th century. (Passiv)\n3.  If the temperature (rise) … above 90 °C, the system shuts down.\n4.  By next year, the company (install) … 2,000 charging stations.\n5.  A hydraulic jack (use) … Pascal’s law.\n6.  When the inspector arrived, the leak (already / repair) … . (Passiv)\n7.  If I (be) … you, I would check the valves first.\n8.  The oil (change) … every 15,000 km. (Passiv)\nB) Schreib ins Passiv (je 1 P.):\n9.  The pump moves the refrigerant through the system.\n10.  Engineers designed the turbine in 2020.\n11.  They will replace the old boilers.\n12.  Someone has damaged the cable.\nC) Korrigiere den Fehler (je 1 P.):\n13.  The compressor is increasing the pressure always.\n14.  How much screws do we need?\n15.  If it will rain, the test is cancelled.\nTeil 4 – Technical Description (20 P.)\nDescribe how a four-stroke internal combustion engine works (150–200 words). Include: a short overview, the four strokes in the correct order, what the piston and valves do in each stroke. Use the present simple and at least three passive sentences.\nBewertung: Inhalt 8 · Aufbau 4 · Grammatik 4 · Fachvokabular 4\nProbeklausur 2 (60 Punkte, 90 min)\nTeil 1 – Leseverstehen (15 P.)\nElectric vehicles. An electric vehicle (EV) is powered by one or more electric motors instead of an internal combustion engine. The energy is stored in a lithium-ion battery pack, which is usually placed under the floor of the car to lower the centre of gravity. An inverter converts the direct current (DC) from the battery into alternating current (AC) for the motor. When the driver brakes, regenerative braking allows the motor to act as a generator, so part of the kinetic energy is fed back into the battery. Compared with conventional cars, EVs have far fewer moving parts, which reduces maintenance costs. However, their range is still limited, and charging takes longer than refuelling. Fast-charging stations can charge a battery to 80 % in about 20 to 30 minutes. Manufacturers such as Volkswagen and Mercedes-Benz are investing billions in new battery technologies, for example solid-state batteries, which are expected to offer a higher energy density and improved safety.\n1.  Where is the battery usually placed, and why? (2 P.)\n2.  What is the function of the inverter? (2 P.)\n3.  Explain regenerative braking. (3 P.)\n4.  Name one advantage and two disadvantages of EVs mentioned in the text. (3 P.)\n5.  How long does fast charging to 80 % take? (1 P.)\n6.  What are the expected benefits of solid-state batteries? (2 P.)\n7.  Find a word in the text meaning “to put money into something”. (2 P.)\nTeil 2 – Vokabeln (10 P.) Erkläre auf Englisch in einem Satz.\n1.  personal protective equipment – 2. torque wrench – 3. air compressor – 4. piston – 5. exhaust stroke – 6. renewable energy – 7. energy transition – 8. polymer – 9. stress-strain diagram – 10. hydraulic jack\nTeil 3 – Grammatik (15 P.)\nA) Richtige Zeitform (je 1 P.):\n1.  Every year, Germany (produce) … more electricity from wind.\n2.  Please be quiet – the professor (explain) … the experiment.\n3.  Before the oil crisis, cars (use) … much more fuel. (used to)\n4.  By 2045, Germany (become) … climate-neutral. (Future Perfect)\n5.  The air (compress) … and stored in a tank. (Passiv)\n6.  If engineers (not discover) … lithium-ion technology, EVs would not exist today. (Type 3)\n7.  If the battery is empty, the car (stop) … . (Type 0)\n8.  We (test) … three prototypes so far. (Present Perfect)\nB) Verbinde zu einem Conditional-Satz (je 1 P.):\n9.  The pressure is too high. The valve opens. (Type 0)\n10.  We get the funding. We will build a test rig. (Type 1)\n11.  I don’t have a car. I don’t drive to university. (Type 2)\nC) a few / a little / much / many (je 1 P.):\n12.  How … time do we have?\n13.  Only … students passed the test.\n14.  Add … grease to the bearing.\n15.  How … kilowatts does the motor have?\nTeil 4 – Technical Description (20 P.)\nDescribe how an air compressor works (150–200 words). Include: what it is used for, its main parts (motor, piston or rotary screw, tank, pressure switch, valves) and the working process step by step. Use the present simple and at least three passive sentences.\nBewertung: Inhalt 8 · Aufbau 4 · Grammatik 4 · Fachvokabular 4\nLösungen\nA1: 1. claw hammer – 2. spanner / wrench – 3. safety goggles (safety glasses) – 4. ear plugs / ear defenders (ear muffs) – 5. steel-toe(d) boots – 6. power drill – 7. wire cutters – 8. hard hat\nA2: Kurbelwelle = crankshaft · Kolben = piston · Zündkerze = spark plug · Auslassventil = exhaust valve · Zylinderkopf = cylinder head · Windschutzscheibe = windscreen (BrE) / windshield (AmE) · Kofferraum = boot (BrE) / trunk (AmE) · Getriebe = gearbox / transmission\nA3: 1. range – 2. fossil fuels – 3. regenerative braking – 4. renewable – 5. composite – 6. tensile strength – 7. wind turbine – 8. charging station\nB1: 1. increases – 2. is replacing – 3. is developing – 4. boils – 5. isn’t running\nB2: 1. is checked (by the engineer) every hour – 2. was assembled in Wolfsburg – 3. will be welded (by the robot) – 4. has been tested – 5. is ignited by the spark plug\nB3: 1. melts – 2. will buy – 3. used – 4. would not have failed\nB4: 1. will have phased out – 2. had already stopped – 3. used to – 4. will have run\nB5: 1. a little – 2. many – 3. a little – 4. much\nProbeklausur 1\n• Teil 1: 1. No – it transfers heat from a cold to a warm place. 2. evaporator, compressor, condenser, expansion valve. 3. The refrigerant absorbs heat from the air, ground or water and evaporates. 4. It increases the pressure and temperature of the gas. 5. It delivers 4 units of heat per 1 unit of electricity. 6. It can run on renewable electricity.\n• Teil 2: 1. protective gloves – 2. screwdriver – 3. crankshaft – 4. cylinder – 5. charging station – 6. range – 7. renewable energy – 8. composite (material) – 9. pressure – 10. efficiency\n• Teil 3 A: 1. are working – 2. was built – 3. rises – 4. will have installed – 5. uses – 6. had already been repaired – 7. were – 8. is changed\n• Teil 3 B: 9. The refrigerant is moved through the system by the pump. 10. The turbine was designed (by engineers) in 2020. 11. The old boilers will be replaced. 12. The cable has been damaged.\n• Teil 3 C: 13. The compressor always increases the pressure. 14. How many screws do we need? 15. If it rains, the test is cancelled.\n• Teil 4 (Musterlösung, Ausschnitt): A four-stroke engine converts the chemical energy of fuel into mechanical energy. Each cycle consists of four strokes. In the intake stroke, the piston moves down and the air-fuel mixture is drawn into the cylinder through the open intake valve. In the compression stroke, both valves are closed and the mixture is compressed by the rising piston. In the power stroke, the mixture is ignited by the spark plug, and the expanding gases push the piston down. In the exhaust stroke, the exhaust valve opens and the burnt gases are pushed out by the piston. The up-and-down movement is converted into rotation by the crankshaft.\nProbeklausur 2\n• Teil 1: 1. Under the floor – to lower the centre of gravity. 2. It converts DC from the battery into AC for the motor. 3. When braking, the motor works as a generator and feeds kinetic energy back into the battery. 4. Advantage: fewer moving parts / lower maintenance costs. Disadvantages: limited range, longer charging time. 5. About 20–30 minutes. 6. Higher energy density and improved safety. 7. to invest (investing)\n• Teil 2: Musterbeispiele – 1. Equipment such as helmets, gloves and goggles that protects workers from injuries. 4. A cylindrical part that moves up and down inside the cylinder. 10. A device that lifts heavy loads using a liquid under pressure (Pascal’s law). Die anderen: lass sie von mir prüfen.\n• Teil 3 A: 1. produces – 2. is explaining – 3. used to use – 4. will have become – 5. is compressed – 6. had not discovered – 7. stops – 8. have tested\n• Teil 3 B: 9. If the pressure is too high, the valve opens. 10. If we get the funding, we will build a test rig. 11. If I had a car, I would drive to university.\n• Teil 3 C: 12. much – 13. a few – 14. a little – 15. many\n• Teil 4: Schick mir deinen Text – ich bewerte ihn nach dem Schema (Inhalt, Aufbau, Grammatik, Vokabul"};</script><script>'use strict';
// Added learning activities based on the technical topics in the source file.
const gameTerms=[
 ['claw hammer','A tool with a split claw for removing nails.'],
 ['spanner','A tool for tightening hexagonal nuts and bolts.'],
 ['safety goggles','Eye protection worn when working with tools.'],
 ['power drill','A powered tool for making holes.'],
 ['crankshaft','A shaft that converts piston movement into rotation.'],
 ['piston','A cylindrical part that moves inside a cylinder.'],
 ['spark plug','The component that ignites the air–fuel mixture.'],
 ['exhaust valve','The valve through which burnt gases leave a cylinder.'],
 ['range','The distance an electric car can travel on one charge.'],
 ['regenerative braking','Recovering energy while braking by using the motor as a generator.'],
 ['composite','A material made by combining different constituent materials.'],
 ['tensile strength','The maximum tensile stress a material withstands before breaking.'],
 ['wind turbine','A device that converts wind energy into electricity.'],
 ['charging station','A place where an electric vehicle battery can be recharged.'],
 ['inverter','A device that converts battery DC into AC for the motor.'],
 ['evaporator','The heat-pump component where refrigerant absorbs heat and evaporates.'],
 ['compressor','The component that increases the pressure and temperature of refrigerant gas.'],
 ['condenser','The component where refrigerant releases heat and becomes liquid.'],
 ['expansion valve','The component that reduces refrigerant pressure before a new cycle.'],
 ['hydraulic jack','A device that lifts a heavy load using a liquid under pressure.']
];
const processTasks=[
 {title:'Four-stroke engine',steps:['Intake: the piston moves down; the intake valve opens and mixture enters.','Compression: the piston moves up; both valves are closed and the mixture is compressed.','Power: the mixture is ignited; expanding gases push the piston down.','Exhaust: the piston moves up; the exhaust valve opens and burnt gases leave.'],ex:'One cycle follows intake, compression, power and exhaust. Intake draws in the mixture; compression prepares it; combustion produces work; exhaust removes burnt gases.'},
 {title:'Heat-pump cycle',steps:['Evaporator: the refrigerant absorbs heat and evaporates.','Compressor: the gas pressure and temperature increase.','Condenser: heat is released and the refrigerant condenses.','Expansion valve: pressure drops and the cycle can repeat.'],ex:'Starting at the evaporator, follow evaporation, compression, condensation and expansion. A heat pump transfers heat rather than creating it.'}
];
let memoryGame=null,quizGame=null,sequenceGame=null;
function shuffled(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function gameStats(){state.games||={memoryWins:0,quizAttempts:0,quizBest:0,sequenceWins:[]};return state.games}
function games(){const s=gameStats();return heading('Memory & interactive practice','Remember it. Put it to work.','Play short activities in English, get immediate feedback and build recall.')+`<div class="notice">Added study activities based on the source topics. These games are separate from the 60-point practice exams.</div><div class="grid"><div class="card"><small>Memory rounds completed</small><div class="stat">${s.memoryWins}</div></div><div class="card"><small>Best vocabulary challenge</small><div class="stat">${s.quizBest}/10</div><small>${s.quizAttempts} completed attempts</small></div><div class="card"><small>Processes mastered</small><div class="stat">${s.sequenceWins.length}/2</div></div></div><div class="toolbar"><button onclick="showGame('memory')">Memory match</button><button class="secondary" onclick="showGame('quiz')">Vocabulary challenge</button><button class="secondary" onclick="showGame('sequence')">Build a process</button></div><div id="gamearea">${memoryGame?memoryView():`<section class="card"><h2>Choose your activity</h2><p><strong>Memory match:</strong> uncover six term–definition pairs.</p><p><strong>Vocabulary challenge:</strong> answer ten multiple-choice questions with explanations.</p><p><strong>Build a process:</strong> arrange the engine strokes or heat-pump stages in order.</p><button onclick="showGame('memory')">Start memory match</button></section>`}</div>`}
function showGame(kind){if(kind==='memory'){if(!memoryGame)newMemory();else updateGame(memoryView())}else if(kind==='quiz'){if(!quizGame)newQuiz();else updateGame(quizView())}else{if(!sequenceGame)newSequence(0);else updateGame(sequenceView())}}
function updateGame(html){$('#gamearea').innerHTML=html}
function newMemory(){const terms=shuffled(gameTerms).slice(0,6);memoryGame={cards:shuffled(terms.flatMap((t,id)=>[{id,text:t[0],kind:'Term'},{id,text:t[1],kind:'Definition'}])),open:[],matched:[],moves:0,message:'Turn over a card. Match each term with its definition.',complete:false};updateGame(memoryView())}
function memoryView(){const g=memoryGame;return `<section class="card"><div class="row spread"><h2>Memory match</h2><button class="secondary" onclick="newMemory()">New round</button></div><p>Find six term–definition pairs. Use Tab and Enter or tap a card.</p><div class="row spread"><strong>${g.matched.length}/6 pairs · ${g.moves} attempts</strong><span>Terms + definitions</span></div>${progress(g.matched.length,6)}<p id="gamefeedback" class="feedback" role="status">${esc(g.message)}</p><div class="memorygrid">${g.cards.map((c,i)=>{const matched=g.matched.includes(c.id),open=g.open.includes(i)||matched;return `<button class="memorycard ${matched?'matched':open?'revealed':''}" ${matched?'disabled':''} aria-label="${open?esc(c.kind+': '+c.text):'Hidden card '+(i+1)}" aria-pressed="${open}" onclick="flipMemory(${i})"><small>${matched?'Matched':open?c.kind:'CARD '+(i+1)}</small><span>${open?esc(c.text):'?'}</span></button>`}).join('')}</div>${g.open.length===2&&!g.complete?'<button class="secondary" onclick="hideMemory()">Turn cards back over</button>':''}${g.complete?'<div class="notice"><strong>All pairs found!</strong> Your result is saved. Try another round to practise different terms.</div>':''}</section>`}
function flipMemory(i){const g=memoryGame;if(!g||g.complete||g.open.length===2||g.open.includes(i)||g.matched.includes(g.cards[i]?.id))return;g.open.push(i);if(g.open.length===2){g.moves++;const [a,b]=g.open.map(x=>g.cards[x]);if(a.id===b.id){g.matched.push(a.id);g.open=[];g.message=`Matched: ${a.kind==='Term'?a.text:b.text}.`;if(g.matched.length===6){g.complete=true;g.message='Round complete! You found all six pairs.';gameStats().memoryWins++;save()}}else g.message='These cards do not match. Remember their positions, then turn them back over.'}else g.message='Choose another card to find its matching term or definition.';updateGame(memoryView())}
function hideMemory(){if(memoryGame.open.length!==2)return;memoryGame.open=[];memoryGame.message='Try another pair.';updateGame(memoryView())}
function newQuiz(){quizGame={questions:shuffled(gameTerms).slice(0,10).map(t=>({term:t[0],definition:t[1],options:shuffled([t[0],...shuffled(gameTerms.filter(x=>x[0]!==t[0])).slice(0,3).map(x=>x[0])])})),index:0,score:0,selected:null,complete:false,errors:[]};updateGame(quizView())}

const modules=[['Tools & PPE','Name tools and explain workplace safety.','A1','Tools, safety goggles, hard hat','Wear safety goggles when drilling.','Personal protective equipment (PPE) protects workers. Learn tool names as complete technical terms.'],['Technical processes','Describe technical processes precisely.','B1','Present Simple · Present Continuous','A compressor increases the pressure of a gas.','Use the present simple for general operating principles and the present continuous for temporary activities. This module grouping is an added study structure.'],['Automotive engineering','From the piston to the crankshaft.','A2','Engine components · passive voice','The mixture is ignited by the spark plug.','The four strokes are intake, compression, power and exhaust. The passive voice focuses on the process: be + past participle.'],['Electric vehicles','Drive systems, batteries and regenerative braking.','A3','Range · regenerative braking','The inverter converts DC into AC.','During braking, the motor acts as a generator. In the source, exercise A3 covers Modules 4–6 together.'],['Energy & transition','Understand energy sources and heat pumps.','B3','Renewable energy · conditionals','If you heat ice, it melts.','Conditionals: Type 0 for general facts, Type 1 for real future possibilities, Type 2 for hypothetical situations and Type 3 for unreal past conditions.'],['Materials & properties','Describe materials and their properties.','B5','Composite · tensile strength','Carbon-fibre-reinforced plastic is a composite material.','Tensile strength describes resistance to breaking under tension. Information, oil and energy are uncountable; bolts, screws and kilowatts are countable.']];

let currentRoute=location.hash.slice(1)||'home'; function go(route){currentRoute=route;render()}function heading(k,t,p=''){return `<div class="eyebrow">${k}</div><h1>${t}</h1><p class="muted">${p}</p>`}

function home(){const done=Object.keys(state.done).length;return heading('Your learning space','Understand engineering.<br>Use English with confidence.','Your practice space for English for Mechanical Engineers.')+`<section class="hero"><div><div class="eyebrow">Short sessions. Steady progress.</div><h2>Get ready for your English test.</h2><p>Practise technical vocabulary, understand grammar and train under exam conditions. At your own pace.</p><button onclick="go('modules')">Start learning</button></div><div class="schematic"><svg viewBox="0 0 300 200" fill="none" aria-label="Piston schematic" role="img"><g stroke="#9cbcb0" stroke-width="2"><path d="M60 20h180v110H60zM80 20v85h140V20M70 54h160M70 64h160M150 105v40l35 25"/><circle cx="185" cy="170" r="24"/><circle cx="185" cy="170" r="7"/><path d="M35 40H15v100h70M250 40h35v100h-60" stroke-dasharray="5 5"/></g><path d="M80 70h140v35H80z" fill="#d6ee94" fill-opacity=".6"/><text x="15" y="190" fill="#d6ee94" font-size="12" font-family="monospace">LEARN / PRACTISE / APPLY</text></svg></div></section><div class="grid"><div class="card"><small>Exercises checked</small><div class="stat">${done}<small> / 46</small></div>${progress(done,46)}</div><div class="card"><small>Vocabulary cards mastered</small><div class="stat">${Object.values(state.known).filter(Boolean).length}<small> / ${cards().length}</small></div><p class="muted">German and English in both directions</p></div><div class="card"><small>Your practice target</small><div class="stat">40<small> / 60 points</small></div><p class="muted">Practice exams · 90 minutes each</p></div></div><div class="row spread"><h2>Your six learning modules</h2><a href="#modules">View all modules</a></div>${moduleCards()}<div class="notice">These practice exams are exercises from your file. The official exam format and pass mark have not been confirmed.</div>`}
function moduleCards(){return `<div class="grid">${modules.map((m,i)=>`<article class="card module"><span class="num">MODULE ${i+1}</span><h3>${m[0]}</h3><p class="muted">${m[1]}</p><a href="#modules/${i}">Open module</a></article>`).join('')}</div>`}
function modulePage(arg){if(arg===undefined)return heading('Learning modules','Build your technical foundation','Topic-based learning paths using the exercises from your TXT file.')+`<div class="notice">The file identifies Module 1, Module 3 and the Modules 4–6 topic block. The more detailed grouping, especially Module 2, is an added study structure, not a confirmed course syllabus.</div>`+moduleCards();const i=Number(arg),m=modules[i];if(!m)return modulePage();return heading(`Module ${i+1}`,m[0],m[1])+`<div class="card"><h2>${m[3]}</h2><p>${m[5]}</p><p lang="en"><strong>${m[4]}</strong></p><div class="toolbar"><button onclick="go('${m[2][0]==='A'?'vocab':'grammar'}/${m[2]}')">Open matching exercises</button><button class="secondary" onclick="go('reading/${i===3?1:0}')">Practise reading</button></div></div><h2 class="sectionhead">Put it into practice</h2>`+exercise(groupBy(m[2]),false)}
function exercise(g,exam=false){return `<section class="card"><h2>${esc(g.id+' · '+g.title)}</h2><p class="muted">Enter only the missing word or sentence ending. For sentence corrections, write the complete sentence.</p>${g.questions.map((q,i)=>{let id=g.id+'-'+i;return `<div class="question"><label for="q-${id}" lang="${g.id==='A1'||g.id==='A2'?'de':'en'}">${i+1}. ${esc(q.q)}</label><input id="q-${id}" value="${esc(state.answers[id]||'')}" autocomplete="off" spellcheck="false" oninput="state.answers['${id}']=this.value;save()"><div class="toolbar"><button onclick="check('${g.id}',${i})">Check answer</button></div><div id="f-${id}" class="feedback" role="status"></div></div>`}).join('')}</section>`}
function check(gid,i){const q=groupBy(gid).questions[i],id=gid+'-'+i,ok=correct($('#q-'+id).value,q.a);state.done[id]=ok;save();const el=$('#f-'+id);el.className='feedback'+(ok?'':' bad');el.innerHTML=`<strong>${ok?'Correct.':'Not quite yet.'}</strong> Answer: <span lang="en">${esc(q.a.join(' / '))}</span><br>${esc(q.ex)}`}
const pairs=[['Schutzhandschuhe','protective gloves'],['Schraubenzieher','screwdriver'],['Zylinder','cylinder'],['Ladestation','charging station'],['Reichweite','range'],['erneuerbare Energie','renewable energy'],['Verbundwerkstoff','composite'],['Druck','pressure'],['Wirkungsgrad','efficiency'],['Zugfestigkeit','tensile strength'],['Windkraftanlage','wind turbine'],['fossile Brennstoffe','fossil fuels'],['Rekuperation','regenerative braking']];

function freeQ(n,type,i,q,isExam){const key=`${n}-${type}-${i}`,val=isExam?(state.exam[n]?.answers?.[key]||''):(state.answers[key]||'');const finished=state.exam[n]?.finished;return `<div class="question"><label for="free-${key}" lang="en">${i+1}. ${esc(q.q)}</label><textarea id="free-${key}" ${isExam&&finished?'readonly':''} oninput="freeSave(${n},'${type}',${i},this.value,${isExam})">${esc(val)}</textarea>${!isExam||finished?`<details><summary>Compare sample answer</summary><p lang="en">${esc(Array.isArray(q.a)?q.a.join(' / '):q.a)}</p>${q.added?'<small>Added example; no answer is provided in the source file.</small>':''}</details>`:''}</div>`}

function writing(arg){let n=Number(arg)||0;return heading('Writing practice','Make your explanation work.','Technical description · 150–200 words · at least three passive sentences.')+`<div class="toolbar"><button onclick="go('writing/0')">Four-stroke engine</button><button class="secondary" onclick="go('writing/1')">Air compressor</button></div><div class="card"><h2>Technical description</h2><p lang="en">${esc(DATA.exams[n].writing)}</p><label for="draft">Your English text</label><textarea id="draft" style="min-height:300px" oninput="state.writing[${n}]=this.value;save();$('#wordcount').textContent=wordCount(this.value)+' words'">${esc(state.writing[n]||'')}</textarea><p id="wordcount" role="status">${wordCount(state.writing[n]||'')} words</p><button onclick="writingFeedback(${n})">Review text with checklist</button><div id="writingFeedback" role="status"></div>${modelBlock(n)}</div>`}

function examPage(arg){if(arg===undefined)return heading('Exam practice','Your rehearsal.','Two practice exams from the TXT file. Each lasts 90 minutes and is worth 60 points.')+`<div class="notice warn">Practice only: the official exam format has not been confirmed. Practise without a dictionary or phone. The source recommends a target of at least 40/60 points. The official pass mark is unknown.</div><div class="grid two">${DATA.exams.map((e,n)=>`<article class="card"><span class="eyebrow">90 minutes · 60 points</span><h2>Practice exam ${n+1}</h2><p>${n?'Electric vehicles & air compressor':'Heat pump & four-stroke engine'}</p><p>Reading 15 · Vocabulary 10 · Grammar 15 · Writing 20</p><button onclick="go('exams/${n}')">${state.exam[n]?.started?'Open attempt':'Prepare practice exam'}</button></article>`).join('')}</div>`;const n=Number(arg),e=DATA.exams[n];if(!e)return examPage();const a=state.exam[n];if(!a?.started)return heading('Practice · not an official format',`Practice exam ${n+1}`,'The timer begins when you select “Start 90 minutes”. Answers are saved locally.')+`<div class="card"><p>Your attempt is submitted automatically after 90 minutes. Reloading or switching pages does not pause the timer. Sample answers are shown only after submission.</p><p>Grammar${n===0?' and vocabulary':''} are checked automatically. Reading, writing${n===1?' and term definitions':''} are self-assessed using the sample answers.</p><button onclick="beginExam(${n})">Start 90 minutes</button></div>`;

function beginExam(n){state.exam[n]={started:Date.now(),answers:{},finished:false,manual:{}};save();render()}

function manualFields(n){return [...DATA.exams[n].read.map((q,i)=>({key:'r'+i,label:'Reading '+(i+1),max:q.p})),...(n===1?DATA.exams[n].vocab.map((_,i)=>({key:'v'+i,label:'Vocabulary '+(i+1),max:1})):[]),...['Content','Structure','Grammar','Technical vocabulary'].map((x,i)=>({key:'w'+i,label:'Writing: '+x,max:[8,4,4,4][i]}))]}
function totalScore(n){const a=state.exam[n],fs=manualFields(n),complete=fs.every(f=>a.manual[f.key]!==undefined&&a.manual[f.key]!=='');return {auto:examAuto(n),manual:fs.reduce((s,f)=>s+Number(a.manual[f.key]||0),0),complete}}
function examResult(n){const score=totalScore(n);return `<section class="card sectionhead"><h2>Results</h2><p id="total" role="status">${scoreText(n)}</p><div class="notice">Automatic score: ${score.auto}/${n===0?25:15} points. Free-text answers are not automatically assessed for meaning. Compare your answers with the solutions below and enter your points. Automatic checking may miss other factually correct formulations.</div><details><summary>Enter self-assessment</summary><p>Reading: award points for the relevant content elements in each sample answer. Definitions: award 1 point for a factually correct English explanation. Writing: assess the four criteria up to their stated maximum.</p>${manualFields(n).map(f=>`<label for="m-${f.key}">${f.label} (0–${f.max})</label><input class="scoreinput" id="m-${f.key}" type="number" min="0" max="${f.max}" step="0.5" value="${state.exam[n].manual[f.key]??''}" oninput="manualScore(${n},'${f.key}',this,${f.max})">`).join('')}</details><button class="secondary" onclick="downloadExam(${n})">Download answers & results</button></section>`}
function scoreText(n){const s=totalScore(n),total=s.auto+s.manual;return `<strong>${total}/60 points ${s.complete?'(including self-assessment)':'so far (self-assessment incomplete)'}</strong>${s.complete?` · ${total>=40?'Practice target of 40/60 reached.':'Practice target of 40/60 not yet reached.'}`:''}`}
function manualScore(n,k,el,max){const v=el.value;state.exam[n].manual[k]=v===''?'':Math.max(0,Math.min(max,Math.round(Number(v)*2)/2));if(v!=='')el.value=state.exam[n].manual[k];save();$('#total').innerHTML=scoreText(n)}
function download(name,text,type='text/plain'){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadExam(n){let a=state.exam[n],e=DATA.exams[n],lines=[`Practice exam ${n+1} – Practice, not an official format`,scoreText(n).replace(/<[^>]+>/g,''),''];for(const [t,qs] of [['r',e.read],['v',e.vocab],['g',e.grammar]])qs.forEach((q,i)=>lines.push(q.q,a.answers[`${n}-${t}-${i}`]||'(blank)','Answer: '+(Array.isArray(q.a)?q.a.join(' / '):q.a),''));lines.push('Writing',a.answers[`${n}-w-0`]||'');download(`Practice exam-${n+1}.txt`,lines.join('\n'))}
function plan(){const done=Object.keys(state.done).length,right=Object.values(state.done).filter(Boolean).length;return heading('Progress & study plan','Build a study routine.','Your data stays in this browser. This flexible study plan is an added learning recommendation.')+`<div class="grid"><div class="card"><small>Exercises attempted</small><div class="stat">${done}/46</div>${progress(done,46)}</div><div class="card"><small>Correct on last check</small><div class="stat">${right}/46</div>${progress(right,46)}</div><div class="card"><small>Study sessions completed</small><div class="stat">${Object.values(state.plan).filter(Boolean).length}/8</div>${progress(Object.values(state.plan).filter(Boolean).length,8)}</div></div><section class="card"><h2>Your study plan</h2><label for="testdate">Your exam date (optional)</label><input id="testdate" type="date" value="${esc(state.testdate||'')}" onchange="state.testdate=this.value;save();render()"><p>${state.testdate?daysUntil():'Set a date to see the time remaining. The source lists 15 January and 22 January without a year, so no fixed dates are assumed.'}</p>${['Tools & PPE: A1, 15 minutes of vocabulary','Technical processes: B1 and B2, 25 minutes','Automotive: A2 and engine description, 30 minutes','Electric vehicles: reading passage 2 and A3, 30 minutes','Energy: heat pump and B3, 30 minutes','Materials: B4, B5 and vocabulary review, 25 minutes','Practice exam 1: 90 minutes + review','Practice exam 2: 90 minutes + targeted revision'].map((t,i)=>`<label class="check"><input type="checkbox" ${state.plan[i]?'checked':''} onchange="state.plan[${i}]=this.checked;save();render()"><span>${i+1}. ${t}</span></label>`).join('')}</section><section class="card sectionhead"><h2>Exam progress</h2>${DATA.exams.map((_,n)=>`<p>Practice exam ${n+1}: ${state.exam[n]?.finished?scoreText(n):state.exam[n]?.started?'in progress':'not started'}</p>`).join('')}</section><div class="toolbar"><button onclick="download('Study-progress.json',JSON.stringify(state,null,2),'application/json')">Export backup</button></div><p class="muted">The backup contains your answers and writing. Clearing browser data or using another browser may make your local progress unavailable.</p>`}
function daysUntil(){const now=new Date(),d=new Date(state.testdate+'T12:00:00'),today=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12);const days=Math.round((d-today)/86400000);return days>=0?`${days} days left. Spread the eight sessions across your available time and review mistakes between sessions.`:'Your selected date is in the past. You can set a new date.'}
function source(){return heading('Transparency','Built from your source file.','Exercises and answer keys from your Technical English practice file, dated 21 November 2026.')+`<div class="card"><h2>Content and sources</h2><ul><li>All 46 worksheet A/B exercises, both reading passages and both exams come from your file.</li><li>English grammar explanations, the study plan, module pages and missing term definitions are added study material.</li><li>The file does not provide a complete module structure. This website adds a topic-based organisation.</li><li>Exam 2, grammar question 6 is labelled Type 3 in the source. “If engineers had not discovered …, EVs would not exist today” is actually a mixed conditional: a past condition with a present consequence. The answer “had not discovered” remains valid.</li><li>Technical statements in the reading passages are practice material, not currently verified product or market advice.</li><li>40/60 is the practice target in the file; an official pass mark has not been confirmed.</li><li>Automatic checks compare answers with stored variants. Free writing requires self-assessment; no AI marking is provided.</li></ul><button class="secondary" onclick="download('Quelle.txt',DATA.source)">Download original file</button><p class="muted">The original source is in German. German terms remain only in bilingual vocabulary exercises.</p></div>`}
document.addEventListener('click',event=>{const link=event.target.closest('a[href^="#"]');if(!link)return;event.preventDefault();const route=link.getAttribute('href').slice(1);if(route==='main')document.querySelector('main').focus();else go(route)});window.addEventListener('hashchange',()=>{currentRoute=location.hash.slice(1)||'home';render()});render();



</script></body></html>
